<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora Nutricional</title>
  <link rel="stylesheet" href="index.css">
  <link rel="stylesheet" href="menu.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>
 <div id="menu"></div>



  <div class="container">
    <h1>Calculadora Nutricional</h1>
    <form id="formulario">
      <label for="edad">Edad</label>
      <input type="number" id="edad" placeholder="Edad" value="">
      <div id="aviso-envejecimiento">

      </div>

      <label for="peso">Peso (kg)</label>
      <input type="number" id="peso" placeholder="Peso (kg)" value="">

      <label for="estatura">Estatura (cm)</label>
      <input type="number" id="estatura" placeholder="Estatura (cm)" value="">

      <label for="sexo">Sexo asignado al nacer:</label>
      <select id="sexo" name="sexo">
        <option value="">Seleccione</option>
        <option value="m">Masculino</option>
        <option value="f">Femenino</option>
        <option value="otro">Prefiero no responder</option>
      </select>

      <div id="estadoFemenino" style="display: none;">
        <label for="condicionFemenina">¿Estás embarazada o en lactancia?</label>
        <select id="condicionFemenina" name="condicionFemenina">
          <option value="ninguna">Ninguna</option>
          <option value="embarazo">Embarazo</option>
          <option value="lactancia">Lactancia</option>
        </select>
      </div>

      <div id="trimestreEmbarazo" style="display: none;">
        <label for="trimestre">¿En qué trimestre estás?</label>
        <select id="trimestre" name="trimestre">
          <option value="1">1° trimestre</option>
          <option value="2">2° trimestre</option>
          <option value="3">3° trimestre</option>
        </select>
      </div>

      <label for="actividad">Nivel de actividad física</label>
      <select id="actividad" name="actividad">
        <option value="">Nivel de Actividad</option>
        <option value="sedentario">Sedentario (No realiza ejercicio) </option>
        <option value="ligero">Ligero (ejercicio 1 - 3 veces a la semana)</option>
        <option value="moderado">Moderado (ejercicio 3 - 5 veces a la semana)</option>
        <option value="activo">Activo (ejercicio 6 - 7 veces a la semana)</option>
        <option value="muy_activo">Muy activo (Atletas, entrenaminetos intensos)</option>
      </select>

      <label for="enfermedad">¿Tienes alguna enfermedad?</label>
      <select id="enfermedad" name="enfermedad">
        <option value="ninguna">Ninguna</option>
        <option value="diabetes">Diabetes (Azúcar alta)</option>
        <option value="hipertension">Hipertensión (Presión alta)</option>
        <option value="colesterol">Colesterol alto (Grasa en sangre)</option>
        <option value="obesidad">Obesidad (Sobrepeso)</option>
        <option value="celiaquia">Enfermedad celíaca ( Intolerancia al gluten)</option>
        <option value="tiroides">Problemas de tiroides (Problema hormonal)</option>
        <option value="renal">Enfermedad renal (Problema de riñones)</option>
        <option value="cardiaca">Enfermedad cardiovascular (Problema del corazón)</option>
        <option value="digestiva">Problemas digestivos (Problema estomacal)</option>
      </select>

     <label for="objetivo">¿Cuál es tu objetivo?</label>
<select id="objetivo" name="objetivo">
  <option value="bajar">Bajar grasa</option>
  <option value="masa">Aumentar masa muscular</option>
  <option value="tonificar">Tonificar / Definir</option>
  <option value="mantener">Mantener</option>
</select>

      <button type="submit">Calcular</button>

    </form>

    <div id="resultado"></div>
  </div>

<script src="menu.js"></script>

<script>
fetch("menu.html")
  .then(res => res.text())
  .then(data => {
    document.getElementById("menu").innerHTML = data;

    setTimeout(() => {
      iniciarMenu();
    }, 0);

  });
</script>

<script src="calculadora.js"></script>

</body>

</html>
